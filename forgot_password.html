<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria - Mandaue City Public Cemetery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <header>
        <div class="headerContainer">
            <div class="logoSection">
                <img src="assets/images/MandaueLogo.png" alt="Mandaue City Logo">
                <img src="assets/images/DGSLogo.png" alt="Department of General Services Logo">
                <div class="headerText">
                    <h1>Department of General Services</h1>
                    <h2>Mandaue City</h2>
                </div>
            </div>
        </div>
    </header>

    <div class="accountRecovery">
        <section>
            <div class="banner">
                <img src="assets/images/MemoriaLogo.png" alt="Memoria Logo">
                <p class="cemeteryName">Mandaue City Public Cemetery</p>
            </div>
        </section>

        <section>
            <div class="inputWrapper">
                <div class="inputHeader">
                    <h2>Account Recovery</h2>
                    <p>Verify your details to reset your password.</p>
                </div>
                <form action="#">
                    <div class="inputBox">
                        <input type="text" placeholder="Fullname" required>
                    </div>
                    <div class="inputBox">
                        <input type="text" placeholder="Username" required>
                    </div>
                    <div class="inputBox">
                        <input type="email" placeholder="Email Address" required>
                    </div>
                    <div class="inputBox">
                        <input type="tel" placeholder="Phone Number" required>
                    </div>
                    <div class="inputBox">
                        <input type="password" placeholder="New Password" required>
                    </div>
                    <button type="submit" class="btnReset">Reset Password</button>
                </form>

                <div class="loginLink">
                    Back to <a href="login.html">Log In</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
