<body>
    <!-- Main Dashboard Wrapper -->
    <div class="dashboardContent is-loading">

        <!-- Skeleton Loading -->
        <div class="dashboardSkeleton" aria-hidden="true">
            <section class="skeletonStatsRow">
                <div class="skeletonWideCard">
                    <div class="skeletonSection">
                        <div class="skeletonBlock skeletonIcon"></div>
                        <div class="skeletonTextLines">
                            <div class="skeletonBlock skeletonLineMd"></div>
                            <div class="skeletonBlock skeletonLineSm"></div>
                        </div>
                    </div>
                    <div class="skeletonSection">
                        <div class="skeletonBlock skeletonIcon"></div>
                        <div class="skeletonTextLines">
                            <div class="skeletonBlock skeletonLineMd"></div>
                            <div class="skeletonBlock skeletonLineSm"></div>
                        </div>
                    </div>
                    <div class="skeletonSection">
                        <div class="skeletonBlock skeletonIcon"></div>
                        <div class="skeletonTextLines">
                            <div class="skeletonBlock skeletonLineMd"></div>
                            <div class="skeletonBlock skeletonLineSm"></div>
                        </div>
                    </div>
                    <div class="skeletonSection">
                        <div class="skeletonBlock skeletonIcon"></div>
                        <div class="skeletonTextLines">
                            <div class="skeletonBlock skeletonLineMd"></div>
                            <div class="skeletonBlock skeletonLineSm"></div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="skeletonChartsRow">
                <div class="skeletonChartCard">
                    <div class="skeletonBlock skeletonHeader"></div>
                    <div class="skeletonPieWrap">
                        <div class="skeletonBlock skeletonPie"></div>
                        <div class="skeletonLegend">
                            <div class="skeletonBlock skeletonLegendRow"></div>
                            <div class="skeletonBlock skeletonLegendRow"></div>
                            <div class="skeletonBlock skeletonLegendRow"></div>
                            <div class="skeletonBlock skeletonLegendRow"></div>
                            <div class="skeletonBlock skeletonLegendRow"></div>
                        </div>
                    </div>
                </div>
                <div class="skeletonChartCard">
                    <div class="skeletonBlock skeletonHeader"></div>
                    <div class="skeletonBars">
                        <div class="skeletonBlock skeletonBar" style="height: 45%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 65%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 35%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 80%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 55%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 70%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 40%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 85%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 60%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 50%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 75%"></div>
                        <div class="skeletonBlock skeletonBar" style="height: 30%"></div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Status Cards -->
        <section class="statsGrid grid5">
            <!-- Total Interments -->
            <div class="statCard accentPrimary" id="total_interments">
                <div class="statTop">
                    <span class="statTitle">Total Interments</span>
                    <div class="iconBadge"><i class="fas fa-monument"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_total_interments"></h2>
                </div>
            </div>

            <!-- Available Graves -->
            <div class="statCard accentSuccess" id="available_graves">
                <div class="statTop">
                    <span class="statTitle">Available Graves</span>
                    <div class="iconBadge"><i class="fas fa-border-all"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_available_graves"></h2>
                </div>
            </div>

            <!-- Expiring Leases -->
            <div class="statCard accentWarning" id="expiring_leases">
                <div class="statTop">
                    <span class="statTitle">Expiring Leases</span>
                    <div class="iconBadge"><i class="fas fa-clock"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_expiring_leases"></h2>
                    <span class="badge badgeWarning">Next 30 Days</span>
                </div>
            </div>

            <!-- Pending Payments -->
            <div class="statCard accentPrimary" id="pending_payments">
                <div class="statTop">
                    <span class="statTitle">Pending Payments</span>
                    <div class="iconBadge"><i class="fas fa-credit-card"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_pending_payments"></h2>
                    <span class="badge badgeWarning">Action Req.</span>
                </div>
            </div>

            <!-- Unverified Accounts -->
            <div class="statCard accentDanger" id="unverified_accounts">
                <div class="statTop">
                    <span class="statTitle">Unverified Accounts</span>
                    <div class="iconBadge"><i class="fas fa-user-shield"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_unverified_accounts"></h2>
                    <span class="badge badgeDanger">Action Req.</span>
                </div>
            </div>
        </section>

        <!-- Charts -->
        <section class="chartsGrid">
            <!-- Pie chart: grave status breakdown -->
            <div class="pieChartCard">
                <div class="chartHeader">
                    <div>
                        <h3>Grave Status Distribution</h3>
                        <span class="chartSubtext">Real-time allotment status breakdown</span>
                    </div>
                </div>
                <div class="pieChartBody">
                    <div class="pieCanvasWrap">
                        <canvas id="grave_status_chart"></canvas>
                    </div>
                    <ul class="pieLegend" id="grave_status_legend"></ul>
                </div>
            </div>

            <!-- Bar chart: lease expirations per month -->
            <div class="barChartCard">
                <div class="chartHeader">
                    <div>
                        <h3>Monthly Lease Expiration</h3>
                        <span class="chartSubtext">Scheduled expirations for the next 12 months</span>
                    </div>
                </div>
                <div class="chartWrapper">
                    <canvas id="monthly_expiration_chart"></canvas>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/dashboard.js"></script>
