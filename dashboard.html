<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria</title>

    <meta name="description" content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications.">
    <meta name="author" content="Team DND">
    <meta name="theme-color" content="#2f3136">
    <meta name="robots" content="index, follow">

    <meta name="geo.region" content="PH-CEB">
    <meta name="geo.placename" content="Mandaue City">

    <meta property="og:type" content="website">
    <meta property="og:url" content="/">
    <meta property="og:site_name" content="Memoria">
    <meta property="og:title" content="Memoria | Cemetery Management System">
    <meta property="og:description" content="Efficiently manage and locate records within the Cemetery.">
    <meta property="og:image" content="https://cdn1.iconfinder.com/data/icons/government-buildings-5/504/cemetery-graveyard-tombstone-burial-memorial-512.png">

    <meta name="twitter:card" content="summary_large_image">

    <script src="assets/js/skeleton.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="api/rootcolors.php" onerror="console.error('Failed to load custom colors. Using default theme.')">
    <link rel="stylesheet" href="assets/css/dashboard.css">
</head>
<body>
    <div class="dashboardContent">
        <section class="statsGrid">
            <div class="statCard accentPrimary">
                <div class="statTop">
                    <span class="statTitle">Total Interments</span>
                    <div class="iconBadge"><i class="fas fa-monument"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_total_interments"></h2>
                </div>
            </div>

            <div class="statCard accentSuccess">
                <div class="statTop">
                    <span class="statTitle">Available Graves</span>
                    <div class="iconBadge"><i class="fas fa-border-all"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_available_graves"></h2>
                </div>
            </div>

            <div class="statCard accentWarning">
                <div class="statTop">
                    <span class="statTitle">Expiring Leases</span>
                    <div class="iconBadge"><i class="fas fa-clock"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_expiring_leases"></h2>
                    <span class="badge badgeWarning">Next 30 Days</span>
                </div>
            </div>

            <div class="statCard accentDanger">
                <div class="statTop">
                    <span class="statTitle">Unverified Accounts</span>
                    <div class="iconBadge"><i class="fas fa-user-shield"></i></div>
                </div>
                <div class="statBottom">
                    <h2 class="statValue" id="stat_unverified_accounts"></h2>
                    <span class="badge badgeDanger">Action Req.</span>
                </div>
            </div>
        </section>

        <section class="chartsGrid">
            <div class="pieChartCard">
                <div class="chartHeader">
                    <div>
                        <h3>Grave Status Distribution</h3>
                        <span class="chartSubtext">Real-time allotment status breakdown</span>
                    </div>
                </div>
                <div class="pieChartBody">
                    <div class="pieCanvasWrap">
                        <canvas id="grave_status_chart"></canvas>
                    </div>
                    <ul class="pieLegend" id="grave_status_legend"></ul>
                </div>
            </div>

            <div class="barChartCard">
                <div class="chartHeader">
                    <div>
                        <h3>Monthly Lease Expiration</h3>
                        <span class="chartSubtext">Scheduled expirations for the next 12 months</span>
                    </div>
                </div>
                <div class="chartWrapper">
                    <canvas id="monthly_expiration_chart"></canvas>
                </div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="assets/js/dashboard.js"></script>
</body>
</html>
