<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memoria</title>

    <meta
      name="description"
      content="Management system for the Cemetery. Locate plots, monitor leases, and manage notifications."
    />
    <meta name="author" content="Team DND" />
    <meta name="theme-color" content="#2f3136" />
    <meta name="robots" content="index, follow" />
    <meta name="geo.region" content="PH-CEB" />
    <meta name="geo.placename" content="Mandaue City" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:site_name" content="Memoria" />
    <meta property="og:title" content="Memoria | Cemetery Management System" />
    <meta
      property="og:description"
      content="Efficiently manage and locate records within the Cemetery."
    />
    <meta
      property="og:image"
      content="https://cdn1.iconfinder.com/data/icons/government-buildings-5/504/cemetery-graveyard-tombstone-burial-memorial-512.png"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="assets/css/root.css" />
    <link
      rel="stylesheet"
      href="api/rootcolors.php"
      onerror="
        console.error('Failed to load custom colors. Using default theme.')
      "
    />
    <link rel="stylesheet" href="assets/css/map.css" />

    <script src="assets/js/check_user.js"></script>
  </head>

  <body>
    <!-- Main application map container -->
    <div class="mapContainer">
      <div class="main">
        <div class="mapCard">
          <!-- Map header with title and action buttons -->
          <div class="mapHeader">
            <h3>Mandaue City Public Cemetery 2D Map</h3>
            <div class="mapBtn">
              <button class="editBtn" id="btnEditMap" type="button">
                Edit Layout
              </button>
              <button class="plotBtn" id="btnAddBlock" type="button">
                Add Block
              </button>
              <button
                class="cancelBtn"
                id="btnCancelEdit"
                type="button"
                style="display: none"
              >
                Cancel Edit
              </button>
              <button
                class="saveBtn"
                id="btnSaveMap"
                type="button"
                style="display: none"
              >
                Save Layout
              </button>

              <!-- Reshape Toolbar buttons -->
              <button
                class="reshapeSubBtn done"
                id="btnKeepSide"
                style="display: none"
                type="button"
                onclick="MAP.keepSplitSide()"
              >
                &#10003; Keep this side
              </button>
              <button
                class="reshapeSubBtn"
                id="btnSwapSide"
                style="display: none"
                type="button"
                onclick="MAP.swapSplitSide()"
              >
                &#8646; Other side
              </button>
              <button
                class="reshapeSubBtn done"
                id="btnDoneReshape"
                style="display: none"
                type="button"
                onclick="MAP.exitReshapeMode()"
              >
                &#10003; Done Reshape
              </button>
              <button
                class="cancelBtn"
                id="btnUndoReshape"
                style="display: none"
                type="button"
                onclick="MAP.undoReshape()"
              >
                &#8630; Undo
              </button>
            </div>
          </div>

          <!-- Map status metadata display -->
          <div class="mapMeta">
            <div class="mapStatus" id="mapStatus"></div>
          </div>

          <!-- The mapCanvas container supporting camera transforms and rendering -->
          <div class="mapCanvas" id="mapCanvas">
            <div
              id="mapCamera"
              style="
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                transform-origin: 0 0;
                will-change: transform;
              "
            >
              <!-- Background cemetery map image -->
              <img
                id="cemetery_map_image"
                src="api/images/cemetery_map_image.png"
                onerror="
                  this.onerror = null;
                  this.src = 'assets/images/cemetery_map_image.png';
                  console.error(
                    'Failed to load dynamic logo. Using default logo.',
                  );
                "
                alt="Cemetery Map Image"
                style="
                  position: absolute;
                  top: 0;
                  left: 0;
                  object-fit: fill;
                  z-index: 0;
                  pointer-events: none;
                  user-select: none;
                "
              />
              <!-- Interactive canvas layer -->
              <canvas
                id="mapCvs"
                style="
                  position: absolute;
                  top: 0;
                  left: 0;
                  display: block;
                  background: transparent;
                  z-index: 1;
                "
              ></canvas>
            </div>

            <!-- Hint overlay and loading indicator -->
            <div class="mapHint" id="mapHint"></div>
            <div class="mapLoading" id="mapLoading">Loading map&hellip;</div>
          </div>

          <!-- Map legend explaining block occupancy status -->
          <div class="mapLegend">
            <div class="legendItem">
              <div
                class="legendDot"
                style="background: #dbeafe; border-color: #3b82f6"
              ></div>
              Block is Empty
            </div>
            <div class="legendItem">
              <div
                class="legendDot"
                style="background: #fef9c3; border-color: #eab308"
              ></div>
              Block is Occupied
            </div>
            <div class="legendItem">
              <div
                class="legendDot"
                style="background: #fee2e2; border-color: #ef4444"
              ></div>
              Block is Full
            </div>
          </div>
        </div>
      </div>

      <!-- Modal dialog overlay container -->
      <div class="modalOverlay" id="modalOverlay">
        <div class="modalBox">
          <h3 id="modalTitle"></h3>
          <div id="modalBody"></div>
          <div class="modalActions">
            <button id="modalCancel">Cancel</button>
            <button id="modalConfirm" class="btnPrimary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript dependency imports and initialization scripts -->
    <script src="assets/js/alert.js"></script>
    <script src="assets/js/confirm_ui.js"></script>
    <script src="assets/js/map.js"></script>
    <script src="assets/js/load_site_contents.js"></script>
    <script>
      refreshImages();
    </script>
  </body>
</html>
