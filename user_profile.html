  <body>
    <div class="settingsContent">
      <div class="settingsCard">
        <div class="sectionTitle profileTitle">
          <i class="fas fa-user-circle"></i>
          <div>
            <h2>Profile Information</h2>
            <p>Update your personal details and credentials</p>
          </div>
        </div>

        <form id="profile_form" autocomplete="off">
          <div class="formGrid">
            <div class="formGroup">
              <label for="name">Fullname</label>
              <input type="text" class="profileField" id="name" readonly />
            </div>
            <div class="formGroup">
              <label for="user_name">Username</label>
              <input type="text" class="profileField" id="user_name" readonly />
            </div>
            <div class="formGroup">
              <label for="email">Email Address</label>
              <input type="email" class="profileField" id="email" readonly />
            </div>
            <div class="formGroup">
              <label for="phone_number">Phone Number</label>
              <input
                type="tel"
                class="profileField"
                id="phone_number"
                readonly
              />
            </div>
          </div>

          <div class="inlinePasswordSection" id="inlinePasswordSection" hidden>
            <hr class="formDivider" />
            <div class="formGrid">
              <div class="formGroup">
                <label for="new_pass">New Password</label>
                <div class="passwordWrapper">
                  <input type="password" id="new_pass" />
                  <button
                    class="togglePassword"
                    type="button"
                    onclick="togglePass('new_pass', this)"
                  >
                    <i class="fas fa-eye-slash"></i>
                  </button>
                </div>
              </div>
              <div class="formGroup">
                <label for="confirm_pass">Confirm Password</label>
                <div class="passwordWrapper">
                  <input type="password" id="confirm_pass" />
                  <button
                    class="togglePassword"
                    type="button"
                    onclick="togglePass('confirm_pass', this)"
                  >
                    <i class="fas fa-eye-slash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="editModeNotice" id="editModeNotice" hidden>
            <i class="fas fa-pencil-alt"></i>
            You're editing your profile. Save or cancel before leaving this
            page.
          </div>

          <div class="saveRow">
            <button
              class="btn secondaryBtn"
              type="button"
              id="cancelProfileBtn"
              hidden
            >
              <i class="fas fa-times"></i> Cancel
            </button>
            <button class="btn primaryBtn" type="button" id="editProfileBtn">
              <i class="fas fa-pen"></i> Edit Profile
            </button>
            <button
              class="btn secondaryBtn"
              type="button"
              id="changePasswordBtn"
            >
              <i class="fas fa-key"></i> Change Password
            </button>
            <button
              class="btn primaryBtn"
              type="button"
              id="saveChangesBtn"
              hidden
            >
              <i class="fas fa-save"></i> Save Changes
            </button>
            <button
              class="btn primaryBtn"
              type="button"
              id="updatePasswordBtn"
              hidden
            >
              <i class="fas fa-save"></i> Update Password
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- i think this is on admin or higher i guess the delete modal and alert hehe-->
