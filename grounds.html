<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:type" content="website">

    <meta property="og:title" content="Memoria | Cemetery Management System">
    <meta property="og:description" content="Efficiently manage and locate records within the Cemetery.">
    <meta property="og:image" content="https://cdn1.iconfinder.com/data/icons/government-buildings-5/504/cemetery-graveyard-tombstone-burial-memorial-512.png">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">

    <link rel="stylesheet" href="assets/css/root.css">
    <link rel="stylesheet" href="api/rootcolors.php" onerror="console.error('Failed to load custom colors. Using default theme.')">
    <link rel="stylesheet" href="assets/css/sidebar.css">

    <script src="assets/js/check_user.js"></script>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <script>
            (function () {
                var sidebarEl = document.getElementById('sidebar');
                sidebarEl.classList.add('no-transition');
                if (localStorage.getItem('sidebarCollapsed') === 'true') {
                    sidebarEl.classList.add('collapsed');
                }
            })();
        </script>

        <div class="sidebarTop">
            <div class="memoriaLogo" id="logo_toggle">
                <img id="cemetery_logo" src="api/images/cemetery_logo.png" onerror="this.onerror = null; this.src = 'assets/images/MemoriaLogo.png'; console.error('Failed to load dynamic logo. Using default logo.');" alt="Memoria Logo" class="fullLogo" />
                <img id="cemetery_logo_small" src="api/images/cemetery_logo_small.png" onerror="this.onerror = null; this.src='assets/images/MLogo.png'; console.error('Failed to load dynamic logo. Using default logo.');" alt="M Logo" class="collapsedLogo" />
            </div>
            <div class="sidebarDateTime" id="date_time_display"></div>
        </div>

        <div class="sidebarNav">
            <div class="sidebarSection">Main</div>
            <a href="dashboard.html" class="menu" target="contentFrame"><i class="fas fa-chart-pie"></i><span>Dashboard</span></a>

            <div class="sidebarSection">Management</div>
            <a href="reserve.html" class="menu" target="contentFrame"><i class="fas fa-thumbtack"></i><span>Reserve</span></a>
            <a href="payments.html" class="menu" target="contentFrame"><i class="fa-solid fa-receipt"></i><span>Payments</span></a>

            <div class="sidebarSection">System</div>
            <a href="settings.html" class="menu" target="contentFrame"><i class="fas fa-cog"></i><span>Settings</span></a>
        </div>

        <div class="sidebarFooter">
            <div class="userCard">
                <div class="userAvatar">
                    <div class="avatarBox" id="user_avatar">--</div>
                    <div class="statusIndicator"></div>
                </div>

                <div class="userDetails">
                    <span class="username" id="user_name"></span>
                    <span class="userRole" id="user_role"></span>
                </div>

                <button class="logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </div>

    <main class="mainContent">
        <iframe name="contentFrame" src="dashboard.html" title="Main Content Area"></iframe>
    </main>

    <script src="assets/js/sidebar.js"></script>
</body>
</html>
