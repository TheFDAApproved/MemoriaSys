<body>
    <div class="monitorContent">
        <div class="tableControls">
            <div class="searchBox">
                <i class="fas fa-search"></i>
                <input type="text" id="user_search" placeholder="Search...">
            </div>

            <div class="paginationContainer">
                <div class="paginationControls">
                    <button class="pageNavBtn" id="prev_page_btn" title="Previous Page">   
                        <i class="fas fa-chevron-left"></i>
                    </button>

                    <div class="carouselViewport" id="carousel_viewport">
                        <div class="carouselTrack" id="carousel_track"></div>
                    </div>

                    <button class="pageNavBtn" id="next_page_btn" title="Next Page">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="table">
            <div class="tableHeader">
                <h3>Monitor</h3>
                <span class="pageInfoText">Page <strong id="current_page_num">1</strong> of <span id="total_pages_num">1</span></span>
            </div>
        </div>

        <div class="tableWrapper">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Block</th>
                        <th>Date Expiration</th>
                        <th>Contact Person</th>
                        <th>Contact No.</th>
                        <th class="buriedHeader">Name</th>
                        <th class="buriedHeader">Address</th>
                        <th class="buriedHeader">Contact Person</th>
                        <th class="buriedHeader">Contact No.</th>
                        <th class="buriedHeader">Contact Address</th>
                        <th>Remarks</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="reservation"></tbody>
            </table>

            <p class="noData" id="monitor_no_data">
                <i class="fas fa-inbox"></i>
                No data found
            </p>
        </div>
    </div>

    <script src="assets/js/alert.js"></script>
    <script src="assets/js/confirm_modal.js"></script>
    <script src="assets/js/table_skeleton.js"></script>
    <script src="assets/js/monitor_burial_modal.js"></script>
    <script src="assets/js/monitor.js"></script>
</body>
</html>
